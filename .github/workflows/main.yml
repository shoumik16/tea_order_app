
name: Next.js Build Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build application
      - name: Build Next.js
        run: npm run build

      # 5. Upload build output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-production-build
          path: .next/
          retention-days: 5
