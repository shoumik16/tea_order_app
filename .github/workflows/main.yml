

name: Next.js CI Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Debug repository files
      - name: Debug files
        run: |
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "Find package-lock.json:"
          find . -name "package-lock.json"

      # Step 3: Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 4: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 5: Build Next.js application
      - name: Build Next.js
        run: npm run build

      # Step 6: Upload build artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-production-build
          path: .next/
          retention-days: 5

